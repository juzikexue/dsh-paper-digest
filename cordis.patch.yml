# @dsh-local/dsh-paper-digest bundle patch.
# One host row puts the package in the Loader tree: it serves the plugin's own
# config/status routes, runs the daily scheduler, and (via the `dsh.client`
# declaration in package.json) makes the browser half discoverable so the
# "论文日报" settings page can be served by dsh-client-modules.
#
# No secrets live here: every option is edited from the Settings page and
# persisted under <DSH_HOME>/storages/dsh-paper-digest/config.json.
- insert:
    - id: dsh-paper-digest
      name: '@dsh-local/dsh-paper-digest'
